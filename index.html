const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "terminal_pw";
async function openPage(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(B.salt), iterations:B.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(B.iv)}, key, b64(B.data));
  const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}
const err = document.getElementById("err");
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); err.textContent = "Đang mở…";
  const pw = document.getElementById("pw").value, remember = document.getElementById("rem").checked;
  try { await openPage(pw); try { if (remember) localStorage.setItem(KEY, pw); } catch {} }
  catch { err.textContent = "Sai mật khẩu hoặc trình duyệt quá cũ."; }
};
(async () => { let pw = null; try { pw = localStorage.getItem(KEY); } catch {}
  if (pw) { try { await openPage(pw); } catch { try { localStorage.removeItem(KEY); } catch {} } } })();
</script></body></html>
